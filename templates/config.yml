# .factory/config.yml — the repo's contract with the software factory (https://github.com/ahdekkers/factory)
repo: owner/name
vision: VISION.md
daily_ticket_cap: 50            # hard limit on tickets the planner creates per UTC day
max_parallel_builders: 2
max_attempts: 3                 # dispatches per ticket before it is labelled factory:stuck
quiet_hours_utc: null           # e.g. [2, 5]: no new planners or builders from 02:00 to 04:59 UTC
checks:                         # every builder runs these; all must pass before a PR
  - make lint
  - make test
cloud_up: null                  # script that starts the app in a cloud session with demo data and prints its URL;
                                # null until the bootstrap ticket creates it
deploy_workflow: null           # e.g. deploy.yml; builders wait for it after merging
notes: |
  Anything a planner or builder must know that is not in CLAUDE.md.
